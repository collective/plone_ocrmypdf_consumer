[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plone_ocrmypdf_consumer"
version = "0.1.0"
description = "Consumer client for collective.ocrmypdf"
readme = "README.rst"
authors = [
  {name = "Krisztina Elekes", email = "krisztina.elekes@eaudeweb.ro"}
]
maintainers = [
  {name = "", email = ""}
]
classifiers = [

]
license = {text = "MIT license"}
dependencies = [
  "redis>=4.0.0",
  "requests>=2.25.1",
  "ocrmypdf>=14.3.0"
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff"  # linting
]

[project.urls]

bugs = "https://github.com/collective/plone_ocrmypdf_consumer/issues"
changelog = "https://github.com/collective/plone_ocrmypdf_consumer/blob/master/changelog.md"
homepage = "https://github.com/collective/plone_ocrmypdf_consumer"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]


# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"
